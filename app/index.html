<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUSKLINE — multi-panel cover art studio</title>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="src/painter.js">
</head>
<body>
<div id="stage" class="stage">

  <header class="bar">
    <div class="brand">
      <span class="brand-mark">DL</span>
      <div class="brand-words">
        <strong>DUSKLINE</strong>
        <small>multi-panel cover art studio</small>
      </div>
    </div>
    <div class="bar-actions">
      <button class="btn export" data-export="square"  title="Export a 1080 × 1080 PNG">1080×1080&nbsp;PNG</button>
      <button class="btn export" data-export="portrait" title="Export a 1080 × 1350 PNG">1080×1350&nbsp;PNG</button>
      <button class="btn export" data-export="wide"    title="Export a 1920 × 1080 PNG">1920×1080&nbsp;PNG</button>
    </div>
  </header>

  <aside class="side" id="side">

    <section class="group">
      <h2>Post size</h2>
      <div class="chips" id="size-chips">
        <button class="chip" data-size="square">1080²</button>
        <button class="chip" data-size="portrait">4:5</button>
        <button class="chip" data-size="wide">16:9</button>
      </div>
    </section>

    <section class="group">
      <h2>Layout</h2>
      <div class="chips layout-chips" id="layout-chips">
        <button class="chip lay" data-layout="solo"><i class="lg lg-solo"></i>solo</button>
        <button class="chip lay" data-layout="duo"><i class="lg lg-duo"></i>duo</button>
        <button class="chip lay" data-layout="trio"><i class="lg lg-trio"></i>trio</button>
        <button class="chip lay" data-layout="stack"><i class="lg lg-stack"></i>stack</button>
        <button class="chip lay" data-layout="grid"><i class="lg lg-grid"></i>grid</button>
        <button class="chip lay" data-layout="hero"><i class="lg lg-hero"></i>hero</button>
      </div>
    </section>

    <section class="group">
      <h2>Photos</h2>
      <label class="btn wide-btn" for="photo-input">＋ Add photo(s)</label>
      <input type="file" id="photo-input" accept="image/*" multiple hidden>
      <div class="thumbs" id="photo-thumbs"></div>
      <button class="btn soft" id="fill-all">Fill every panel from one photo</button>
      <p class="hint">Photos stay on this machine — nothing is uploaded.</p>
    </section>

    <section class="group">
      <h2>Grade</h2>
      <div class="chips grade-chips" id="grade-chips"></div>
    </section>

    <section class="group">
      <h2>Finish</h2>
      <div class="chips" id="finish-chips">
        <button class="chip" data-finish="grain">grain</button>
        <button class="chip" data-finish="scanlines">scanlines</button>
        <button class="chip" data-finish="halftone">halftone</button>
        <button class="chip" data-finish="vignette">vignette</button>
        <button class="chip" data-finish="frame">frame</button>
      </div>
    </section>

    <section class="group">
      <h2>Caption</h2>
      <input class="field" id="cap-title" maxlength="24" placeholder="TITLE" spellcheck="false">
      <input class="field" id="cap-sub" maxlength="48" placeholder="sub-line (optional)" spellcheck="false">
      <div class="chips" id="cap-pos">
        <button class="chip" data-pos="bottom">bottom</button>
        <button class="chip" data-pos="top">top</button>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="cap-band"> solid band</label>
        <label class="check"><input type="checkbox" id="cap-underline"> sub rule</label>
      </div>
      <div class="row slider-row">
        <span class="lbl">size</span>
        <input type="range" id="cap-scale" min="60" max="140" value="100">
      </div>
    </section>

    <section class="group">
      <h2>Panel <span class="muted" id="panel-no">—</span></h2>
      <select class="field" id="panel-photo"></select>
      <div class="row slider-row">
        <span class="lbl">zoom</span>
        <input type="range" id="panel-zoom" min="100" max="260" value="100">
      </div>
      <button class="btn soft" id="panel-reset">Recenter crop</button>
    </section>

  </aside>

  <main class="board">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="poster" width="1080" height="1080"></canvas>
    </div>
    <p class="board-hint" id="board-hint">click a panel to select · drag to reframe · wheel to zoom</p>
  </main>

</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
