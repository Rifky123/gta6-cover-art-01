<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heatwave Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="src/poster.js">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="brand-mark">HW</span>
    <span class="brand-name">HEATWAVE STUDIO</span>
    <span class="brand-tag">GTA-style cover art from your photos</span>
  </div>
  <nav class="top-actions">
    <button id="btn-demo" type="button" class="ghost">Load demo photos</button>
    <span class="privacy">photos never leave this machine</span>
  </nav>
</header>
<main id="workspace">
  <section id="stage">
    <div id="stage-scroll">
      <canvas id="poster-canvas" width="1080" height="1350"></canvas>
      <p id="stage-hint">Click a panel to select it &middot; drag to move the crop &middot; wheel to zoom</p>
    </div>
  </section>
  <aside id="sidebar"></aside>
</main>
<div id="drop-veil" hidden><div class="drop-msg">Drop photo on a panel</div></div>
<script type="module" src="src/studio.js"></script>
</body>
</html>
