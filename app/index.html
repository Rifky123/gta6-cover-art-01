<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEATSPLIT — multi-panel cover studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell">
  <header id="topbar">
    <div id="brand">
      <span id="brand-mark">HS</span>
      <span id="brand-name">HEATSPLIT</span>
      <span id="brand-sub">multi-panel cover studio</span>
    </div>
    <div id="size-switch" class="seg" role="group" aria-label="Export size">
      <button class="seg-btn" data-size="1080x1080">Square 1080</button>
      <button class="seg-btn" data-size="1080x1350">Portrait 1080&times;1350</button>
      <button class="seg-btn" data-size="1920x1080">Wide 1920</button>
    </div>
    <div id="topbar-actions">
      <button id="btn-demo" class="ghost-btn" title="Load the sample photos">Load samples</button>
      <button id="btn-export" class="accent-btn">Export PNG</button>
    </div>
  </header>

  <main id="workbench">
    <section id="stage">
      <div id="stage-frame">
        <canvas id="poster" width="1080" height="1080"></canvas>
      </div>
      <p id="stage-hint">Drag inside a panel to reframe &middot; wheel to zoom</p>
    </section>

    <aside id="panel-rail">
      <div class="rail-scroll">
        <section class="ctl-group">
          <h2>Photos</h2>
          <div id="photo-tray"></div>
          <div class="row">
            <button id="btn-add" class="ghost-btn wide">Add photo&hellip;</button>
            <input id="file-add" type="file" accept="image/*" multiple hidden>
          </div>
          <div class="row">
            <button id="btn-fill" class="ghost-btn wide" title="Fill every panel with varied crops of one photo">Fill all panels from photo</button>
          </div>
        </section>

        <section class="ctl-group">
          <h2>Layout</h2>
          <div id="layout-grid" class="tile-grid"></div>
        </section>

        <section class="ctl-group">
          <h2>Grade</h2>
          <div id="grade-row" class="chip-row"></div>
          <h2 class="gap-top">Finishes</h2>
          <div id="finish-row" class="chip-row"></div>
        </section>

        <section class="ctl-group">
          <h2>Caption</h2>
          <label class="fld"><span>Title</span><input id="cap-title" type="text" maxlength="40" value="SUNSET SYNDICATE"></label>
          <label class="fld"><span>Sub-line</span><input id="cap-sub" type="text" maxlength="60" value="Vice Coast &middot; Chapter One"></label>
          <label class="fld"><span>Top band text</span><input id="band-top" type="text" maxlength="48" value="HEATSPLIT ORIGINALS"></label>
          <label class="fld"><span>Bottom band text</span><input id="band-bottom" type="text" maxlength="48" value="EPISODE 01 &middot; THE VICE COAST RUN"></label>
          <div class="row">
            <label class="chk"><input id="band-top-on" type="checkbox" checked> top band</label>
            <label class="chk"><input id="band-bottom-on" type="checkbox" checked> bottom band</label>
          </div>
        </section>

        <section class="ctl-group">
          <h2>Export</h2>
          <div class="row wrap">
            <button class="accent-btn slim" data-export="1080x1080">1080&times;1080</button>
            <button class="accent-btn slim" data-export="1080x1350">1080&times;1350</button>
            <button class="accent-btn slim" data-export="1920x1080">1920&times;1080</button>
          </div>
          <p class="tiny">PNG downloads, rendered at true size.</p>
        </section>
      </div>
    </aside>
  </main>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
