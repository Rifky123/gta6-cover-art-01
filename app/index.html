<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALMFORGE — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="booth">
  <aside class="rack" id="rack">
    <header class="brand">
      <h1>PALMFORGE</h1>
      <p class="tag">Forge your poster. Vice-grade, multi-panel.</p>
    </header>

    <section class="group">
      <h2>Poster size</h2>
      <div class="seg" id="sizeSeg" role="radiogroup">
        <button class="segbtn" data-w="1080" data-h="1080" type="button">Square 1080</button>
        <button class="segbtn" data-w="1080" data-h="1350" type="button">Portrait 1080×1350</button>
        <button class="segbtn" data-w="1920" data-h="1080" type="button">Wide 1920×1080</button>
      </div>
    </section>

    <section class="group">
      <h2>Panel layout</h2>
      <div class="seg wrap" id="layoutSeg">
        <button class="segbtn" data-layout="solo" type="button">Solo</button>
        <button class="segbtn" data-layout="diptych" type="button">Diptych</button>
        <button class="segbtn" data-layout="trilogy" type="button">Stacked III</button>
        <button class="segbtn" data-layout="quartet" type="button">Quartet 2×2</button>
        <button class="segbtn" data-layout="skyline" type="button">Skyline</button>
        <button class="segbtn" data-layout="marquee" type="button">Marquee</button>
      </div>
    </section>

    <section class="group">
      <h2>Photos</h2>
      <label class="btn wide" for="photoInput">+ Add photo(s)</label>
      <input id="photoInput" type="file" accept="image/*" multiple hidden>
      <button class="btn wide ghost" id="fillAll" type="button">Fill all panels from one photo</button>
      <ul class="photoList" id="photoList"></ul>
    </section>

    <section class="group">
      <h2>Colour grade</h2>
      <div class="seg wrap" id="gradeSeg">
        <button class="segbtn" data-grade="sunset" type="button">Sunset</button>
        <button class="segbtn" data-grade="neon" type="button">Neon</button>
        <button class="segbtn" data-grade="heat" type="button">Heat</button>
        <button class="segbtn" data-grade="noir" type="button">Noir</button>
        <button class="segbtn" data-grade="vice" type="button">Vice</button>
        <button class="segbtn" data-grade="coral" type="button">Coral</button>
      </div>
      <h2>Finish</h2>
      <div class="chips" id="finishChips">
        <label><input type="checkbox" data-finish="grain"> Film grain</label>
        <label><input type="checkbox" data-finish="scanlines"> Scanlines</label>
        <label><input type="checkbox" data-finish="halftone"> Halftone</label>
        <label><input type="checkbox" data-finish="vignette"> Vignette</label>
        <label><input type="checkbox" data-finish="frame"> Hairline frame</label>
        <label><input type="checkbox" data-finish="chroma"> Chroma split</label>
      </div>
    </section>

    <section class="group">
      <h2>Caption</h2>
      <input id="captionInput" type="text" maxlength="28" value="PALM DRIVE" placeholder="Main caption">
      <input id="sublineInput" type="text" maxlength="60" value="The coast remembers everything" placeholder="Sub-line (optional)">
      <div class="chips" id="captionChips">
        <label><input type="checkbox" data-cap="italic" checked> Skew</label>
        <label><input type="checkbox" data-cap="band" checked> Bottom band</label>
        <label><input type="checkbox" data-cap="topbar" checked> Top bar</label>
      </div>
    </section>

    <footer class="export">
      <button class="btn wide primary" id="exportBtn" type="button">Export PNG</button>
      <p class="status" id="status" role="status"></p>
    </footer>
  </aside>

  <section class="stage">
    <canvas id="stage" aria-label="Live cover preview"></canvas>
    <p class="hint" id="hint">Drag a panel to reframe · scroll to zoom · click a panel to select</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
