<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNGRID — Multi-Panel Poster Studio</title>
<link rel="stylesheet" href="style.css">
<link rel="preload" href="fonts/Anton-Regular.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
<div id="shell">
  <header id="topbar">
    <div id="brand">
      <span id="brand-mark">SUN</span><span id="brand-mark-2">GRID</span>
      <span id="brand-sub">multi-panel poster studio</span>
    </div>
    <div id="size-switch" role="group" aria-label="Export size">
      <button class="size-btn" data-w="1080" data-h="1080" type="button">1:1 · 1080</button>
      <button class="size-btn" data-w="1080" data-h="1350" type="button">4:5 · 1080×1350</button>
      <button class="size-btn is-active" data-w="1920" data-h="1080" type="button">16:9 · 1920×1080</button>
    </div>
    <button id="export-btn" type="button">EXPORT PNG</button>
  </header>
  <div id="workspace">
    <aside id="rail">
      <section class="tool" id="tool-photos">
        <h2 class="tool-head">1 · Photos</h2>
        <label class="drop" id="drop">
          <input id="photo-input" type="file" accept="image/*" multiple>
          <span class="drop-label">Drop or click to load photos</span>
          <span class="drop-hint">stays on your machine</span>
        </label>
        <div id="thumbs" class="thumbs"></div>
        <button id="fill-one" class="ghost-btn" type="button" title="Spread one photo across every panel with varied crops">FILL ALL PANELS · ONE PHOTO</button>
      </section>
      <section class="tool" id="tool-layout">
        <h2 class="tool-head">2 · Panels</h2>
        <div id="layouts" class="layout-grid"></div>
      </section>
      <section class="tool" id="tool-grade">
        <h2 class="tool-head">3 · Grade</h2>
        <div id="grades" class="chip-row"></div>
        <h2 class="tool-head">Finish</h2>
        <div id="finishes" class="chip-row"></div>
      </section>
      <section class="tool" id="tool-caption">
        <h2 class="tool-head">4 · Caption</h2>
        <input id="cap-main" class="field" type="text" maxlength="24" placeholder="MAIN TITLE">
        <input id="cap-sub" class="field" type="text" maxlength="48" placeholder="sub line">
        <div class="chip-row" id="cap-colors"></div>
        <label class="check"><input id="band-on" type="checkbox" checked> top & bottom band</label>
        <input id="band-text" class="field" type="text" maxlength="64" placeholder="band text">
      </section>
    </aside>
    <main id="stage">
      <div id="stage-inner">
        <canvas id="preview" width="1920" height="1080"></canvas>
        <p id="stage-hint">drag a panel to reframe · wheel to zoom · click a thumb to target a panel</p>
      </div>
    </main>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
